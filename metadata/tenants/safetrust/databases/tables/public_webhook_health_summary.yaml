table:
  name: webhook_health_summary
  schema: safetrust
# Legacy GraphQL type name retained to avoid a breaking dashboard release. Its
# fields now describe polling reconciliation and confirmation-retry health.
select_permissions:
  - role: admin
    permission:
      columns:
        - pending_count
        - failed_count
        - oldest_unprocessed_age_minutes
        - last_sync_at
        - sync_lag_seconds
      filter: {}
